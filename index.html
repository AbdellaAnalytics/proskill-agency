    <!-- Fonts must not block the first paint.
         A stylesheet link is render-blocking: the browser downloads the CSS,
         then the font files, and shows nothing until it's done — a round trip
         to Google's servers before a single pixel appears. Loading it as a
         print stylesheet takes it off the critical path, then switching the
         media to all once it arrives applies it. The <noscript> keeps it
         working with JavaScript disabled.
         Every weight requested here is used in the stylesheet; none is waste. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
  
    <!-- Who this shop is, in plain machine-readable form.
         Search crawlers run the app and can work it out; the crawlers behind
         AI assistants generally do not run JavaScript, so for them this block

  <script>
      // Apply the saved theme before first paint (prevents a flash).
      (function () {
        try {
          var t = localStorage.getItem('ps_theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var l = localStorage.getItem('ps_lang') || 'ar';
          var h = document.documentElement;
          h.setAttribute('data-theme', t);
          h.setAttribute('lang', l);
          h.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
